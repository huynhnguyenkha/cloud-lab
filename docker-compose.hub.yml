services:
  backend:
    image: khahuynh210/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000

  frontend:
    image: khahuynh210/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend